<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LinkInsta</title>
  </head>
  <body>
    <h1>LinkInsta yayında 🚀</h1>
    <p>Instagram link takip aracı</p>

    <input
      type="text"
      placeholder="Instagram linkini buraya yapıştır..."
      style="width:90%;max-width:400px;padding:12px;"
      id="iglink"
    />

    <br /><br />

    <button
      onclick="analyze()"
      style="padding:12px 24px;font-size:16px;"
    >
      Analiz Et
    </button>

    <p id="result" style="margin-top:20px;"></p>

    <script>
      async function analyze() {
        const val = document.getElementById("iglink").value.trim();
        const result = document.getElementById("result");

        if (!val) {
          result.innerText = "Lütfen bir Instagram linki gir.";
          return;
        }

        result.innerText = "Analiz ediliyor...";

        try {
          const res = await fetch(`/api/analyze?link=${encodeURIComponent(val)}`);
          const data = await res.json();

          if (data.status !== "ok") {
            result.innerText = data.message;
            return;
          }

          result.innerHTML = `
            <strong>@${data.username}</strong><br>
            Tür: ${data.type}<br>
            Tahmini Takipçi: ${data.followers_estimate}<br>
            Risk: ${data.risk}<br>
            Durum: ${data.message}
          `;
        } catch (e) {
          result.innerText = "Sunucuya ulaşılamadı.";
        }
      }
    </script>
  </body>
</html>
