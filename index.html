<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LinkInsta</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      width: 90%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      margin: 0 0 6px 0;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
      outline: none;
    }

    button {
      margin-top: 14px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      background: #2575fc;
      color: #fff;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 16px;
      font-size: 14px;
    }

    .error {
      color: #d63031;
    }

    .success {
      color: #2d3436;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>LinkInsta 🚀</h1>
    <div class="subtitle">Instagram link analiz aracı</div>

    <input
      type="text"
      id="iglink"
      placeholder="Instagram linkini buraya yapıştır..."
    />

    <button onclick="analyze()">Analiz Et</button>

    <div id="result" class="result"></div>
  </div>

  <script>
    function analyze() {
      const input = document.getElementById("iglink");
      const result = document.getElementById("result");
      const val = input.value.trim();

      if (!val) {
        result.innerHTML = '<span class="error">Lütfen bir link gir.</span>';
        return;
      }

      if (!val.includes("instagram.com")) {
        result.innerHTML = '<span class="error">Bu geçerli bir Instagram linki değil.</span>';
        return;
      }

      result.innerHTML =
        '<span class="success">Link alındı:</span><br>' +
        '<small>' + val + '</small>';
    }
  </script>
</body>
</html>
